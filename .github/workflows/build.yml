name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Files uploaded through the GitHub website can lose their executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: constantmusic-jar
          path: build/libs/*.jar
          if-no-files-found: error
